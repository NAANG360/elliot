name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Build web surface
        run: |
          npm install
          npm --version
          npm run build
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Fetch local inference engine
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git android/app/src/main/cpp/llama.cpp
      - name: Restore stable release signing key
        run: |
          base64 -d android/app/miss-minutes-release.jks.b64 > android/app/miss-minutes-release.jks
          chmod 600 android/app/miss-minutes-release.jks
      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: miss-minutes-0.7.1-apk
          path: android/app/build/outputs/apk/release/app-release.apk
