name: Elliot foundation training

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "CPU training minutes for this run"
        required: true
        default: "120"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: elliot-foundation-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TRAIN_MINUTES: ${{ github.event.inputs.minutes || '120' }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout training source
        uses: actions/checkout@v4
        with:
          ref: feature/elliot-native-interface
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip torch datasets huggingface_hub
      - name: Restore resumable training state
        uses: actions/cache/restore@v4
        with:
          path: training-state
          key: elliot-cpu-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            elliot-cpu-foundation-
      - name: Prepare educational corpus
        run: python ai/train/prepare_corpus.py --output training-state/corpus.txt --max-mb 64
      - name: Train from random initialization
        run: |
          python ai/train/train.py \
            --data training-state/corpus.txt \
            --out training-state/model \
            --steps 1000000 \
            --minutes "$TRAIN_MINUTES" \
            --batch 4 --context 256 --width 192 --layers 4 --heads 4 \
            --eval-every 100 --resume
      - name: Validate checkpoint integrity
        run: python ai/train/evaluate.py --checkpoint training-state/model/model.pt --report training-state/evaluation.json
      - name: Save resumable state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: training-state
          key: elliot-cpu-foundation-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish training checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elliot-foundation-${{ github.run_number }}
          path: |
            training-state/model/
            training-state/evaluation.json
          if-no-files-found: warn
          retention-days: 30
