name: Elliot continuous foundation training

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Training minutes for this session (GitHub-hosted free runners have a 6-hour job limit)"
        required: true
        default: "55"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: elliot-foundation-training
  cancel-in-progress: false

jobs:
  train:
    # Private repositories on GitHub Free have a limited monthly Actions allowance.
    # Default is intentionally conservative; manually dispatch longer sessions when quota permits.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TRAIN_MINUTES: ${{ github.event.inputs.minutes || '55' }}
      HF_HOME: ${{ runner.temp }}/hf-cache
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/elliot-native-interface
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training dependencies
        run: python -m pip install --upgrade pip torch datasets huggingface_hub
      - name: Restore latest training checkpoint
        uses: actions/cache/restore@v4
        with:
          path: training-state
          key: elliot-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            elliot-foundation-
      - name: Collect licensed educational corpus
        run: python ai/train/prepare_corpus.py --output training-state/corpus.txt --max-mb 64
      - name: Train from random initialization or resume
        run: |
          python ai/train/train.py \
            --data training-state/corpus.txt \
            --out training-state/model \
            --steps 1000000 --minutes "$TRAIN_MINUTES" \
            --batch 4 --context 256 --width 192 --layers 4 --heads 4 \
            --eval-every 100 --resume
      - name: Run held-out quality and integrity gates
        run: python ai/train/evaluate.py --checkpoint training-state/model/model.pt --report training-state/evaluation.json
      - name: Save resumable state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: training-state
          key: elliot-foundation-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload checkpoint and evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elliot-foundation-run-${{ github.run_number }}
          path: |
            training-state/model/
            training-state/evaluation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Notify owner only after all quality gates pass
        if: success() && env.NOTIFY_EMAIL != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Elliot passed foundation training gates"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: Elliot Training Bot
          body: "yo phon linging\n\nElliot's current training checkpoint passed the automated integrity and validation gates. This is a training milestone, not a claim of human-level capability. Review the evaluation artifact before approving any release."
