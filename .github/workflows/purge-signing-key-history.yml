name: Purge exposed signing material from Git history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Rewrite all branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/NAANG360/elliot.git" repo.git
          cd repo.git
          git config user.name "Elliot Repository Maintenance"
          git config user.email "actions@users.noreply.github.com"
          python -m pip install --user git-filter-repo
          export PATH="$HOME/.local/bin:$PATH"
          printf '%s' 'TWlzc01pbnV0ZXMyMDI2PT0+KioqUkVNT1ZFRCoqKg==' | base64 -d > /tmp/replacements.txt
          git filter-repo --force --path android/app/miss-minutes-release.jks.b64 --invert-paths --replace-text /tmp/replacements.txt
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/NAANG360/elliot.git"
          git push --force --all origin
          git push --force --tags origin
          echo "History rewrite completed. Verify with secret scanning and GitHub support for cached refs."
