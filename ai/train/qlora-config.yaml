# Starter configuration for a future Miss Minutes QLoRA run.
# Training is intentionally outside the Android build.
base_model: Qwen/Qwen2.5-0.5B-Instruct
dataset: ai/dataset/seed.jsonl
method: qlora
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
training:
  epochs: 3
  learning_rate: 0.0002
  max_seq_length: 1024
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  logging_steps: 10
  save_steps: 100
output_dir: artifacts/miss-minutes-lora
